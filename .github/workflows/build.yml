name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 2:51
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron:  '51 2 * * *'
  workflow_dispatch:
jobs:
  tests:
    strategy:
      matrix:
        # Set this to notify the global nur package registry that changes are
        # available.
        #
        # The repo name as used in
        # https://github.com/nix-community/NUR/blob/master/repos.json
        nurRepo:
          - <YOUR_REPO_NAME>
        # Where build results are pushed, so that CI and anyone using these
        # overlays fetches binaries instead of rebuilding.  The cache host name
        # without the ".cachix.org" suffix.
        #
        # Needs the CACHIX_AUTH_TOKEN repository secret, set at
        # https://github.com/berquist/nur/settings/secrets/actions
        #
        # No signing key: cachix signs server-side for caches created since
        # 2021, and the auth token is the whole credential.  Pushing is skipped
        # on pull requests from forks, which cannot see repository secrets.
        cachixName:
          - nur-berquist
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        nix_path: "${{ matrix.nixPath }}"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    # The three steps below delegate to the Justfile so that the same commands
    # can be run locally: `just ci <channel>` reproduces one matrix leg
    # end-to-end.  Keep the logic there, not here.  The ci-* recipes evaluate
    # against the ambient NIX_PATH, which install-nix-action has already set
    # from matrix.nixPath above.
    - name: Show nixpkgs version
      run: nix shell -f '<nixpkgs>' just -c just ci-version
    - name: Setup cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      # Don't replace <YOUR_CACHIX_NAME> here!
      if: ${{ matrix.cachixName != '<YOUR_CACHIX_NAME>' }}
      with:
        name: ${{ matrix.cachixName }}
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Check evaluation
      run: nix shell -f '<nixpkgs>' just -c just ci-eval
    - name: Build nix packages
      run: nix shell -f '<nixpkgs>' just -c just ci-build
    - name: Trigger NUR update
      # Don't replace <YOUR_REPO_NAME> here!
      if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"
